<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NutriAI</title>
    
    <!-- PWA & Mobile Optimization Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NutriAI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="NutriAI" />
    <meta name="description" content="Um aplicativo de saúde e nutrição com inteligência artificial, plano alimentar, previsão inteligente de esgotamento de despensa, monitor de preços com ofertas de parceiros locais e substituições econômicas inteligentes." />
    <meta property="og:title" content="NutriAI" />
    <meta property="og:description" content="Um aplicativo de saúde e nutrição com inteligência artificial, plano alimentar, previsão inteligente de esgotamento de despensa, monitor de preços com ofertas de parceiros locais e substituições econômicas inteligentes." />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

    <!-- Fonts: Poppins for Titles & Inter for Body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" crossorigin="anonymous" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
    <script>
      // Global emergency reset function
      window.nutriResetApp = function(fullReset) {
        try {
          if (fullReset) {
            localStorage.clear();
            sessionStorage.clear();
          } else {
            localStorage.removeItem('nutri-profile');
            localStorage.removeItem('nutri-local-session-user');
            localStorage.removeItem('nutri-biometric-enabled');
          }
        } catch(e) {}

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
            window.location.reload(true);
          }).catch(function() {
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      };

      // Auto-reveal recovery button if loading takes over 2.5 seconds or uncaught JS error occurs
      window.addEventListener('error', function(e) {
        console.error('Initial boot error:', e);
        var errBox = document.getElementById('boot-error-action');
        if (errBox) errBox.style.display = 'flex';
      });

      window.addEventListener('unhandledrejection', function(e) {
        console.error('Initial unhandled rejection:', e);
        var errBox = document.getElementById('boot-error-action');
        if (errBox) errBox.style.display = 'flex';
      });

      setTimeout(function() {
        var errBox = document.getElementById('boot-error-action');
        if (errBox && document.getElementById('initial-loading')) {
          errBox.style.display = 'flex';
        }
      }, 2500);
    </script>
  </head>
  <body style="background-color: #FAFBFC; color: #1E293B; margin: 0; padding: 0;">
    <div id="root">
      <div id="initial-loading" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; width: 100vw; background-color: #0B0F14; font-family: 'Poppins', 'Inter', sans-serif; padding: 20px; box-sizing: border-box;">
        <div style="width: 56px; height: 56px; border: 3px solid rgba(22, 199, 132, 0.15); border-top-color: #16C784; border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; margin-bottom: 20px;"></div>
        <h1 style="font-size: 26px; font-weight: 700; color: #FFFFFF; margin: 0 0 6px 0; letter-spacing: -0.5px; font-family: 'Poppins', sans-serif;">Nutri<span style="color: #16C784;">AI</span></h1>
        <p style="font-size: 13px; color: #B5BDC9; margin: 0 0 20px 0; font-weight: 500;">Carregando Experiência Premium...</p>
        
        <!-- Emergency reset recovery panel shown after delay or error -->
        <div id="boot-error-action" style="display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px; opacity: 0; animation: fadeIn 0.4s ease forwards;">
          <p style="font-size: 12px; color: #94A3B8; margin: 0; text-align: center;">Demorando mais que o esperado ou travado?</p>
          <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
            <button onclick="window.nutriResetApp(false)" style="background: rgba(22, 199, 132, 0.15); border: 1px solid rgba(22, 199, 132, 0.4); color: #16C784; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
              🔄 Reiniciar App
            </button>
            <button onclick="window.nutriResetApp(true)" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #FCA5A5; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
              🧹 Limpar Cache & Reset Total
            </button>
          </div>
        </div>

        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script type="module">
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('NutriAI PWA Service Worker registrado com sucesso:', reg.scope);
            })
            .catch((err) => {
              console.warn('Falha ao registrar o Service Worker do NutriAI PWA:', err);
            });
        });
      }
    </script>
  </body>
</html>
